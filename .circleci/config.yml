version: 2.1
orbs:
  python: circleci/python@2.0.3
  sonarcloud: sonarsource/sonarcloud@4
  git-shallow-clone: guitarrapc/git-shallow-clone@2.8.0

executors:
  node-executor:
    docker:
      - image: cimg/node:20.11
    resource_class: medium
    working_directory: ~/repo

jobs:
  sonarcloud_scan:
    executor: node-executor
    steps:
      - git-shallow-clone/checkout_advanced:
          clone_options: '--filter=blob:none'
      - run:
          name: "Git fetch"
          command: git fetch --no-filter --refetch
      - sonarcloud/scan

aliases:
  - &base_blackduck_main
    name: "blackduck automatic"
    context:
      - blackduck-scanner
    python-version: "3.10"
    cli-parameters: '--detect.project.version.name=main'
    filters:
      branches:
        only:
          - master

  - &base_blackduck_feature
    <<: *base_blackduck_main
    name: "blackduck feature-branch"
    requires:
      - approve_blackduck_run
    cli-parameters: '--detect.project.version.name=feature-branch'
    filters:
      branches:
        ignore:
          - master

workflows:
  version: 2
  sonarcloud:
    jobs:
      - sonarcloud_scan:
          context:
            - tmh
            - tmh-eu
            - sonarcloud
            
  default:
    jobs:
      # manual blackduck runs for feature branches
      - approve_blackduck_run:
          type: approval
          filters:
            branches:
              ignore:
                - development
      - tmh-blackduck/run-scanner:
          <<: *base_blackduck_feature
          project-name: resin-release-tool

      # automated blackduck runs for main development branch
      - tmh-blackduck/run-scanner:
          <<: *base_blackduck_main
          project-name: resin-release-tool
